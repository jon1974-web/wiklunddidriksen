<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0097A7"/>
      <stop offset="100%" style="stop-color:#00838F"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  
  <!-- House body -->
  <rect x="280" y="480" width="464" height="320" rx="12" fill="white"/>
  
  <!-- House roof -->
  <polygon points="240,500 512,260 784,500" fill="white"/>
  
  <!-- Door -->
  <rect x="440" y="600" width="144" height="200" rx="12" fill="#0097A7"/>
  
  <!-- Door knob -->
  <circle cx="560" cy="700" r="12" fill="white"/>
  
  <!-- Heart above door -->
  <path d="M512,530 L488,506 C468,486 448,470 448,450 C448,430 464,416 484,416 C496,416 508,424 512,432 C516,424 528,416 540,416 C560,416 576,430 576,450 C576,470 556,486 536,506 Z" fill="#E53935"/>
  
  <!-- FS text in heart -->
  <text x="512" y="472" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">FS</text>
  
  <!-- Window left -->
  <rect x="310" y="530" width="100" height="100" rx="8" fill="#0097A7"/>
  <line x1="310" y1="580" x2="410" y2="580" stroke="white" stroke-width="4"/>
  <line x1="360" y1="530" x2="360" y2="630" stroke="white" stroke-width="4"/>
  
  <!-- Window right -->
  <rect x="614" y="530" width="100" height="100" rx="8" fill="#0097A7"/>
  <line x1="614" y1="580" x2="714" y2="580" stroke="white" stroke-width="4"/>
  <line x1="664" y1="530" x2="664" y2="630" stroke="white" stroke-width="4"/>
  
  <!-- Person 1 (far left, adult) -->
  <circle cx="350" cy="815" r="28" fill="white"/>
  <rect x="326" y="843" width="48" height="70" rx="16" fill="white"/>
  
  <!-- Person 2 (left center, child) -->
  <circle cx="450" cy="835" r="22" fill="white"/>
  <rect x="432" y="857" width="36" height="56" rx="12" fill="white"/>
  
  <!-- Person 3 (right center, child) -->
  <circle cx="574" cy="835" r="22" fill="white"/>
  <rect x="556" y="857" width="36" height="56" rx="12" fill="white"/>
  
  <!-- Person 4 (far right, adult) -->
  <circle cx="674" cy="815" r="28" fill="white"/>
  <rect x="650" y="843" width="48" height="70" rx="16" fill="white"/>
</svg>
