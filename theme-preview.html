<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Familiesenter — Temaforhånsvisning</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a1a; color: #fff; padding: 24px; }
  h1 { text-align: center; font-size: 28px; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #999; margin-bottom: 32px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px; max-width: 1400px; margin: 0 auto; }
  .theme-card { border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
  .theme-header { padding: 16px 20px; font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 10px; }
  .theme-header .dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .theme-body { padding: 16px 20px; }
  .section { margin-bottom: 16px; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; opacity: 0.6; }
  .card { border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; }
  .card-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .card-sub { font-size: 13px; opacity: 0.6; }
  .input { border-radius: 10px; padding: 12px 14px; font-size: 14px; border: none; width: 100%; margin-bottom: 8px; }
  .btn { border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; border: none; width: 100%; margin-bottom: 8px; cursor: pointer; }
  .btn-outline { background: transparent; border: 2px solid; padding: 10px; }
  .row { display: flex; gap: 8px; }
  .row .btn { flex: 1; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .chat-bubble { border-radius: 16px; padding: 10px 14px; font-size: 13px; max-width: 80%; margin-bottom: 6px; }
  .chat-own { margin-left: auto; }
  .chat-other { margin-right: auto; }
  .member-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid; }
  .member-row:last-child { border-bottom: none; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #fff; }
  .invite-card { border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 8px; }
  .invite-code { font-size: 24px; font-weight: bold; letter-spacing: 4px; }
  .helper { font-size: 12px; opacity: 0.5; margin-top: 4px; }
  .tab-bar { display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid; margin-top: 12px; }
  .tab { text-align: center; font-size: 18px; opacity: 0.5; }
  .tab.active { opacity: 1; }
</style>
</head>
<body>

<h1>Familiesenter — Temaforhånsvisning</h1>
<p class="subtitle">8 tilgjengelige temaer basert på iPhone 17 Pro-farger + egendefinerte</p>

<div class="grid" id="themes"></div>

<script>
const themes = [
  {
    name: '☀️ Lys (standard)',
    id: 'light',
    dot: '#4CAF50',
    background: '#f5f5f5', surface: '#fff', surfaceVariant: '#f0f0f0',
    text: '#333', textSecondary: '#666', textDisabled: '#999',
    border: '#eee', accent: '#4CAF50', accentLight: '#E8F5E9',
    danger: '#ff4444', inputBackground: '#f5f5f5',
    chatBubbleOwn: '#4CAF50', chatBubbleOther: '#e5e5ea',
    chatTextOwn: '#fff', chatTextOther: '#000',
  },
  {
    name: '🌙 Mørk',
    id: 'dark',
    dot: '#4CAF50',
    background: '#121212', surface: '#1e1e1e', surfaceVariant: '#2c2c2e',
    text: '#e0e0e0', textSecondary: '#a0a0a0', textDisabled: '#666',
    border: '#333', accent: '#4CAF50', accentLight: '#1b3a1e',
    danger: '#ff6b6b', chatBubbleOwn: '#4CAF50', chatBubbleOther: '#2c2c2e',
    chatTextOwn: '#fff', chatTextOther: '#e0e0e0',
    inputBackground: '#2c2c2e',
  },
  {
    name: '🟠 Cosmic Orange',
    id: 'orange',
    dot: '#E87C3E',
    background: '#faf6f3', surface: '#fff', surfaceVariant: '#f5ede8',
    text: '#333', textSecondary: '#666', textDisabled: '#999',
    border: '#f0e0d4', accent: '#E87C3E', accentLight: '#FBE9D7',
    danger: '#ff4444', inputBackground: '#faf6f3',
    chatBubbleOwn: '#E87C3E', chatBubbleOther: '#f0e0d4',
    chatTextOwn: '#fff', chatTextOther: '#333',
  },
  {
    name: '🔵 Deep Blue',
    id: 'deepblue',
    dot: '#1A3A5C',
    background: '#f2f5f8', surface: '#fff', surfaceVariant: '#e8eef4',
    text: '#333', textSecondary: '#666', textDisabled: '#999',
    border: '#d4e0ed', accent: '#1A3A5C', accentLight: '#D6E4F0',
    danger: '#ff4444', inputBackground: '#f2f5f8',
    chatBubbleOwn: '#1A3A5C', chatBubbleOther: '#d4e0ed',
    chatTextOwn: '#fff', chatTextOther: '#333',
  },
  {
    name: '⚪ Silver',
    id: 'silver',
    dot: '#8E8E93',
    background: '#f5f5f5', surface: '#fff', surfaceVariant: '#ebebeb',
    text: '#333', textSecondary: '#666', textDisabled: '#999',
    border: '#ddd', accent: '#8E8E93', accentLight: '#E8E8EA',
    danger: '#ff4444', inputBackground: '#f5f5f5',
    chatBubbleOwn: '#8E8E93', chatBubbleOther: '#e5e5ea',
    chatTextOwn: '#fff', chatTextOther: '#333',
  },
  {
    name: '🟣 Lilla',
    id: 'purple',
    dot: '#9C27B0',
    background: '#f7f2fa', surface: '#fff', surfaceVariant: '#f0e8f5',
    text: '#333', textSecondary: '#666', textDisabled: '#999',
    border: '#e4d4f0', accent: '#9C27B0', accentLight: '#F3E5F5',
    danger: '#ff4444', inputBackground: '#f7f2fa',
    chatBubbleOwn: '#9C27B0', chatBubbleOther: '#e4d4f0',
    chatTextOwn: '#fff', chatTextOther: '#333',
  },
  {
    name: '🩷 Rosa',
    id: 'pink',
    dot: '#F48FB1',
    background: '#fdf5f7', surface: '#fff', surfaceVariant: '#f9edf1',
    text: '#333', textSecondary: '#666', textDisabled: '#999',
    border: '#f3dde4', accent: '#F48FB1', accentLight: '#FDE4EC',
    danger: '#ff4444', inputBackground: '#fdf5f7',
    chatBubbleOwn: '#F48FB1', chatBubbleOther: '#f3dde4',
    chatTextOwn: '#fff', chatTextOther: '#333',
  },
  {
    name: '⚙️ System',
    id: 'system',
    dot: '#999',
    background: '#f5f5f5', surface: '#fff', surfaceVariant: '#f0f0f0',
    text: '#333', textSecondary: '#666', textDisabled: '#999',
    border: '#eee', accent: '#4CAF50', accentLight: '#E8F5E9',
    danger: '#ff4444', inputBackground: '#f5f5f5',
    chatBubbleOwn: '#4CAF50', chatBubbleOther: '#e5e5ea',
    chatTextOwn: '#fff', chatTextOther: '#000',
  },
];

function render(theme) {
  const t = theme;
  return `
    <div class="theme-card" style="background: ${t.surface}">
      <div class="theme-header" style="background: ${t.accent}; color: ${t.chatTextOwn}">
        <div class="dot" style="background: ${t.dot}; ${t.id === 'dark' ? 'border: 2px solid #fff' : ''}"></div>
        ${t.name}
      </div>
      <div class="theme-body">
        <div class="section">
          <div class="section-label" style="color: ${t.textSecondary}">Arrangementer</div>
          <div class="card" style="background: ${t.surface}; border: 1px solid ${t.border}; border-left: 4px solid ${t.accent}">
            <div class="card-title" style="color: ${t.text}">📅 Fotballtrening</div>
            <div class="card-sub" style="color: ${t.textSecondary}">tor. 19. jun. 18:00</div>
            <div class="card-sub" style="color: ${t.accent}; margin-top: 2px">Ekeberg kunstgress</div>
          </div>
        </div>
        <div class="section">
          <div class="section-label" style="color: ${t.textSecondary}">Knapper</div>
          <div class="row">
            <button class="btn" style="background: ${t.accent}; color: ${t.chatTextOwn}">Legg til</button>
            <button class="btn btn-outline" style="border-color: ${t.border}; color: ${t.text}">Avbryt</button>
          </div>
        </div>
        <div class="section">
          <div class="section-label" style="color: ${t.textSecondary}">Chat</div>
          <div class="chat-bubble chat-other" style="background: ${t.chatBubbleOther}; color: ${t.chatTextOther}">Hei! Er du med i dag?</div>
          <div class="chat-bubble chat-own" style="background: ${t.chatBubbleOwn}; color: ${t.chatTextOwn}">Ja, jeg kommer! 🙌</div>
        </div>
        <div class="section">
          <div class="section-label" style="color: ${t.textSecondary}">Familie</div>
          <div style="background: ${t.surfaceVariant}; border-radius: 12px; padding: 4px 12px;">
            <div class="member-row" style="border-color: ${t.border}">
              <div style="display: flex; align-items: center; gap: 8px">
                <div class="avatar" style="background: ${t.accent}">JD</div>
                <div>
                  <div style="color: ${t.text}; font-size: 14px; font-weight: 500">Jon Didriksen</div>
                  <div style="color: ${t.textSecondary}; font-size: 12px">jon@test.no</div>
                </div>
              </div>
              <span class="badge" style="background: ${t.accentLight}; color: ${t.accent}">Eier</span>
            </div>
            <div class="member-row" style="border-color: ${t.border}">
              <div style="display: flex; align-items: center; gap: 8px">
                <div class="avatar" style="background: ${t.textSecondary}">TT</div>
                <div>
                  <div style="color: ${t.text}; font-size: 14px; font-weight: 500">Test Tester</div>
                  <div style="color: ${t.textSecondary}; font-size: 12px">test@test.no</div>
                </div>
              </div>
              <span class="badge" style="background: ${t.surfaceVariant}; color: ${t.textSecondary}">Medlem</span>
            </div>
          </div>
        </div>
        <div class="section">
          <div class="section-label" style="color: ${t.textSecondary}">Invitasjon</div>
          <div class="invite-card" style="background: ${t.surfaceVariant}; border: 1px solid ${t.border}">
            <div class="invite-code" style="color: ${t.accent}">A3F7B2</div>
            <div class="helper" style="color: ${t.textDisabled}">Gyldig i 1 time</div>
          </div>
          <button class="btn" style="background: ${t.accent}; color: ${t.chatTextOwn}">Del lenke</button>
        </div>
        <div class="section">
          <div class="section-label" style="color: ${t.textSecondary}">Faner</div>
          <div class="tab-bar" style="border-color: ${t.border}">
            <div class="tab active" style="color: ${t.accent}">📅</div>
            <div class="tab" style="color: ${t.textDisabled}">🛒</div>
            <div class="tab" style="color: ${t.textDisabled}">💬</div>
            <div class="tab" style="color: ${t.textDisabled}">✈️</div>
            <div class="tab" style="color: ${t.textDisabled}">👤</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

document.getElementById('themes').innerHTML = themes.map(render).join('');
</script>
</body>
</html>
