<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Create — E3 Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a1a;padding:20px}
h1{color:#fff;text-align:center;font-size:20px;margin-bottom:8px}
h2{color:#aaa;text-align:center;font-size:13px;margin-bottom:24px;font-weight:400}
.phone-frame{width:320px;background:#f5f5f5;border-radius:28px;overflow:hidden;box-shadow:0 16px 50px rgba(0,0,0,0.4);margin:0 auto}
.sheet-header{background:#fff;padding:14px 16px 10px;border-bottom:1px solid #eee;border-top-left-radius:28px;display:flex;justify-content:space-between;align-items:center}
.sheet-title{font-size:15px;font-weight:700;color:#333}
.sheet-close{width:24px;height:24px;border-radius:12px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#666}
.sheet-body{padding:10px}
.card-lb{background:#fff;border-radius:12px;margin-bottom:8px;display:flex;overflow:hidden}
.card-lb-border{width:4px;flex-shrink:0}
.card-lb-content{flex:1;padding:10px 12px}
.card-lb-title{font-size:12px;font-weight:700;margin-bottom:8px}
.card-lb-actions{display:flex;gap:6px}
.card-lb-action{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border-radius:10px;flex:1;cursor:pointer;min-width:0}
.card-lb-action:active{opacity:0.85}
.card-lb-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.card-lb-icon svg{width:18px;height:18px}
.card-lb-label{font-size:10px;font-weight:600;text-align:center;line-height:1.2}
</style>
</head>
<body>
<h1>Quick Create</h1>
<h2>E3 — Teal theme on Avtaler, locked colors on modules</h2>
<div class="phone-frame">
  <div class="sheet-header"><span class="sheet-title">Hva vil du opprette?</span><div class="sheet-close">✕</div></div>
  <div class="sheet-body">
    <div class="card-lb">
      <div class="card-lb-border" style="background:#0097A7"></div>
      <div class="card-lb-content">
        <div class="card-lb-title" style="color:#0097A7">Avtaler</div>
        <div class="card-lb-actions">
          <div class="card-lb-action" style="background:#0097A7"><div class="card-lb-icon" style="background:rgba(255,255,255,0.3)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="12" y1="7" x2="12" y2="15"/></svg></div><span class="card-lb-label" style="color:#fff">Manuell</span></div>
          <div class="card-lb-action" style="background:#0097A7"><div class="card-lb-icon" style="background:rgba(255,255,255,0.3)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg></div><span class="card-lb-label" style="color:#fff">Tale</span></div>
          <div class="card-lb-action" style="background:#0097A7"><div class="card-lb-icon" style="background:rgba(255,255,255,0.3)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2l2-3h6l2 3h2a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div><span class="card-lb-label" style="color:#fff">Foto</span></div>
        </div>
      </div>
    </div>
    <div class="card-lb">
      <div class="card-lb-border" style="background:#E53935"></div>
      <div class="card-lb-content">
        <div class="card-lb-title" style="color:#E53935">Helse</div>
        <div class="card-lb-actions">
          <div class="card-lb-action" style="background:#E53935"><div class="card-lb-icon" style="background:rgba(255,255,255,0.3)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="12" y1="7" x2="12" y2="15"/></svg></div><span class="card-lb-label" style="color:#fff">Time</span></div>
          <div class="card-lb-action" style="background:#E53935"><div class="card-lb-icon" style="background:rgba(255,255,255,0.3)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="7" y="9" width="4" height="12" rx="1"/><path d="M12 9V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v6"/><line x1="12" y1="3" x2="12" y2="9"/></svg></div><span class="card-lb-label" style="color:#fff">Vaksine</span></div>
        </div>
      </div>
    </div>
    <div class="card-lb">
      <div class="card-lb-border" style="background:#8E24AA"></div>
      <div class="card-lb-content">
        <div class="card-lb-title" style="color:#8E24AA">Kjæledyr</div>
        <div class="card-lb-actions">
          <div class="card-lb-action" style="background:#8E24AA"><div class="card-lb-icon" style="background:rgba(255,255,255,0.3)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="12" y1="7" x2="12" y2="15"/></svg></div><span class="card-lb-label" style="color:#fff">Vet.besøk</span></div>
          <div class="card-lb-action" style="background:#8E24AA"><div class="card-lb-icon" style="background:rgba(255,255,255,0.3)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="7" y="9" width="4" height="12" rx="1"/><path d="M12 9V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v6"/><line x1="12" y1="3" x2="12" y2="9"/></svg></div><span class="card-lb-label" style="color:#fff">Vaksine</span></div>
        </div>
      </div>
    </div>
    <div class="card-lb">
      <div class="card-lb-border" style="background:#42A5F5"></div>
      <div class="card-lb-content">
        <div class="card-lb-title" style="color:#42A5F5">Reiser</div>
        <div class="card-lb-actions">
          <div class="card-lb-action" style="background:#42A5F5"><div class="card-lb-icon" style="background:rgba(255,255,255,0.3)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88"/></svg></div><span class="card-lb-label" style="color:#fff">Ny reise</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
