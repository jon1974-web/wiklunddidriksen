<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Icon Mockup — Familiesenter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 24px; }
    h1 { text-align: center; margin-bottom: 8px; color: #333; }
    .subtitle { text-align: center; color: #666; margin-bottom: 32px; font-size: 14px; }
    .style-section { margin-bottom: 40px; }
    .style-title { font-size: 18px; font-weight: 700; color: #333; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #0097A7; }
    .tab-bar { display: flex; justify-content: space-around; align-items: center; background: #fff; border-radius: 16px; padding: 16px 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 12px; }
    .tab-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; padding: 8px 12px; border-radius: 12px; transition: background 0.2s; }
    .tab-item:hover { background: #f0f0f0; }
    .tab-label { font-size: 11px; font-weight: 600; color: #666; }
    .tab-item.active .tab-label { color: #0097A7; }

    /* Style A: Bold solid icons */
    .icon-bold { width: 28px; height: 28px; }
    .icon-bold svg { width: 100%; height: 100%; }

    /* Style B: Outline icons */
    .icon-outline { width: 26px; height: 26px; }
    .icon-outline svg { width: 100%; height: 100%; }

    /* Style C: Rounded with background */
    .icon-rounded { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .icon-rounded.active { background: #0097A7; }
    .icon-rounded.inactive { background: #e0e0e0; }
    .icon-rounded svg { width: 20px; height: 20px; }

    .colors-row { display: flex; gap: 16px; justify-content: center; margin-bottom: 24px; }
    .color-chip { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .color-dot { width: 16px; height: 16px; border-radius: 50%; }
  </style>
</head>
<body>

  <h1>🎨 Tab Icon Mockup</h1>
  <p class="subtitle">Tre alternativer for hver fane — velg din favoritt</p>

  <div class="colors-row">
    <div class="color-chip"><div class="color-dot" style="background:#0097A7"></div> <span>Aktiv</span></div>
    <div class="color-chip"><div class="color-dot" style="background:#999"></div> <span>Inaktiv</span></div>
  </div>

  <!-- STYLE A: Bold filled icons -->
  <div class="style-section">
    <div class="style-title">A — Fylte ikoner (tykke linjer)</div>
    <div class="tab-bar">
      <!-- Events: Calendar -->
      <div class="tab-item active">
        <div class="icon-bold">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0097A7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
            <rect x="7" y="13" width="4" height="4" rx="1" fill="#0097A7" stroke="none"/>
          </svg>
        </div>
        <span class="tab-label">Arrangementer</span>
      </div>
      <!-- Matsenter: Utensils -->
      <div class="tab-item">
        <div class="icon-bold">
          <svg viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 002-2V2"/>
            <line x1="7" y1="2" x2="7" y2="22"/>
            <path d="M17 2c0 0 0 5 0 7 0 1.1-.9 2-2 2h-1v11"/>
            <line x1="14" y1="2" x2="14" y2="22"/>
          </svg>
        </div>
        <span class="tab-label">Matsenter</span>
      </div>
      <!-- Chat: Bubble -->
      <div class="tab-item">
        <div class="icon-bold">
          <svg viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
          </svg>
        </div>
        <span class="tab-label">Chat</span>
      </div>
      <!-- Reise: Compass -->
      <div class="tab-item">
        <div class="icon-bold">
          <svg viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88" fill="#999" stroke="none"/>
          </svg>
        </div>
        <span class="tab-label">Reise</span>
      </div>
      <!-- Profil: User -->
      <div class="tab-item">
        <div class="icon-bold">
          <svg viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <span class="tab-label">Profil</span>
      </div>
    </div>
  </div>

  <!-- STYLE B: Thin outline icons -->
  <div class="style-section">
    <div class="style-title">B — Slette ikoner (tynde linjer)</div>
    <div class="tab-bar">
      <!-- Events: Calendar -->
      <div class="tab-item active">
        <div class="icon-outline">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0097A7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
            <circle cx="8" cy="15" r="1.5" fill="#0097A7" stroke="none"/>
            <circle cx="12" cy="15" r="1.5" fill="#0097A7" stroke="none"/>
            <circle cx="16" cy="15" r="1.5" fill="#0097A7" stroke="none"/>
          </svg>
        </div>
        <span class="tab-label">Arrangementer</span>
      </div>
      <!-- Matsenter: Plate -->
      <div class="tab-item">
        <div class="icon-outline">
          <svg viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round">
            <circle cx="12" cy="12" r="9"/>
            <circle cx="12" cy="12" r="4"/>
            <line x1="12" y1="3" x2="12" y2="5"/>
            <line x1="12" y1="19" x2="12" y2="21"/>
          </svg>
        </div>
        <span class="tab-label">Matsenter</span>
      </div>
      <!-- Chat: Message -->
      <div class="tab-item">
        <div class="icon-outline">
          <svg viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
          </svg>
        </div>
        <span class="tab-label">Chat</span>
      </div>
      <!-- Reise: Plane -->
      <div class="tab-item">
        <div class="icon-outline">
          <svg viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.8 19.2L16 11l3.5-3.5C20.3 6.7 20.3 5.3 19.5 4.5 18.7 3.7 17.3 3.7 16.5 4.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.4-.1.9.3 1.1L11 12l-2 3H5l-1 1 3 2 2 3 1-1v-3l3-2 3.7 7.3c.2.4.7.5 1.1.3l.5-.3c.4-.2.5-.6.5-1.1z"/>
          </svg>
        </div>
        <span class="tab-label">Reise</span>
      </div>
      <!-- Profil: User circle -->
      <div class="tab-item">
        <div class="icon-outline">
          <svg viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M20 21c0-3.3-2.7-6-6-6h-4c-3.3 0-6 2.7-6 6"/>
          </svg>
        </div>
        <span class="tab-label">Profil</span>
      </div>
    </div>
  </div>

  <!-- STYLE C: Rounded background icons -->
  <div class="style-section">
    <div class="style-title">C — Runde bakgrunner</div>
    <div class="tab-bar">
      <!-- Events: Calendar -->
      <div class="tab-item active">
        <div class="icon-rounded active">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <span class="tab-label">Arrangementer</span>
      </div>
      <!-- Matsenter: Fork -->
      <div class="tab-item">
        <div class="icon-rounded inactive">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 002-2V2"/>
            <line x1="7" y1="2" x2="7" y2="22"/>
            <path d="M17 2c0 0 0 5 0 7 0 1.1-.9 2-2 2h-1v11"/>
            <line x1="14" y1="2" x2="14" y2="22"/>
          </svg>
        </div>
        <span class="tab-label">Matsenter</span>
      </div>
      <!-- Chat: Bubble -->
      <div class="tab-item">
        <div class="icon-rounded inactive">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
          </svg>
        </div>
        <span class="tab-label">Chat</span>
      </div>
      <!-- Reise: Globe -->
      <div class="tab-item">
        <div class="icon-rounded inactive">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
          </svg>
        </div>
        <span class="tab-label">Reise</span>
      </div>
      <!-- Profil: User -->
      <div class="tab-item">
        <div class="icon-rounded inactive">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <span class="tab-label">Profil</span>
      </div>
    </div>
  </div>

</body>
</html>
