<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Medisin Mockup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  h1 { color: #fff; text-align: center; font-size: 20px; margin-bottom: 20px; }

  .phone-frame {
    width: 375px;
    background: #f5f5f5;
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .modal-header {
    background: #fff;
    padding: 16px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
  }
  .modal-title { font-size: 18px; font-weight: 700; color: #333; }
  .modal-close { font-size: 18px; color: #999; cursor: pointer; }

  .form { padding: 16px; }
  .field { margin-bottom: 16px; }
  .label { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
  .input { width: 100%; padding: 14px; border-radius: 10px; background: #f5f5f5; border: none; font-size: 16px; color: #333; }

  .person-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .person-chip { padding: 6px 14px; border-radius: 16px; font-size: 13px; cursor: pointer; }
  .person-chip.active { background: #E53935; color: #fff; }
  .person-chip.inactive { background: #f5f5f5; color: #333; }

  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }

  .section-header { font-size: 14px; font-weight: 700; color: #E53935; margin: 20px 0 8px; padding-bottom: 6px; border-bottom: 1px solid #eee; }

  .freq-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .freq-label { font-size: 13px; font-weight: 600; color: #333; min-width: 80px; }
  .freq-select { padding: 10px; border-radius: 8px; background: #f5f5f5; border: 1px solid #ddd; font-size: 14px; color: #333; flex: 1; }

  .time-slot { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 10px; background: #fafafa; border-radius: 8px; }
  .time-label { font-size: 12px; font-weight: 600; color: #999; min-width: 50px; }
  .time-input { padding: 8px 12px; border-radius: 8px; background: #fff; border: 1px solid #ddd; font-size: 14px; color: #333; width: 80px; }
  .reminder-row { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .reminder-label { font-size: 11px; color: #999; }
  .reminder-chip { padding: 4px 8px; border-radius: 12px; font-size: 10px; cursor: pointer; }
  .reminder-chip.active { background: #E53935; color: #fff; }
  .reminder-chip.inactive { background: #f0f0f0; color: #666; }

  .modal-actions { display: flex; gap: 12px; padding: 16px; border-top: 1px solid #eee; }
  .modal-btn { flex: 1; padding: 14px; border-radius: 10px; text-align: center; font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn-cancel { background: #f0f0f0; color: #333; }
  .btn-save { background: #E53935; color: #fff; }

  .label { font-size: 12px; color: #888; text-align: center; margin-top: 20px; }
</style>
</head>
<body>

<h1>Add Medisin — Mockup</h1>

<div class="phone-frame">
  <div class="modal-header">
    <span class="modal-title">Legg til medisin</span>
    <span class="modal-close">✕</span>
  </div>

  <div class="form">
    <!-- Navn -->
    <div class="field">
      <div class="label">Medisinnavn</div>
      <input class="input" type="text" value="Paracet" readonly>
    </div>

    <!-- Person -->
    <div class="field">
      <div class="label">Person</div>
      <div class="person-row">
        <span class="person-chip active">Jon</span>
        <span class="person-chip inactive">Hilde</span>
        <span class="person-chip inactive">Selin</span>
      </div>
    </div>

    <!-- Dose -->
    <div class="field">
      <div class="label">Dose</div>
      <input class="input" type="text" value="500mg" readonly>
    </div>

    <!-- Frekvens -->
    <div class="section-header">Frekvens og tider</div>

    <div class="freq-row">
      <span class="freq-label">Frekvens:</span>
      <select class="freq-select">
        <option>1 gang per dag</option>
        <option selected>2 ganger per dag</option>
        <option>3 ganger per dag</option>
        <option>4 ganger per dag</option>
      </select>
    </div>

    <!-- Time slots - 2 ganger per dag -->
    <div class="time-slot">
      <span class="time-label">Tid 1:</span>
      <input class="time-input" type="time" value="08:00">
      <div class="reminder-row">
        <span class="reminder-label">Påminnelse:</span>
        <span class="reminder-chip inactive">15 min</span>
        <span class="reminder-chip active">30 min</span>
        <span class="reminder-chip inactive">1 t</span>
      </div>
    </div>

    <div class="time-slot">
      <span class="time-label">Tid 2:</span>
      <input class="time-input" type="time" value="20:00">
      <div class="reminder-row">
        <span class="reminder-label">Påminnelse:</span>
        <span class="reminder-chip active">15 min</span>
        <span class="reminder-chip inactive">30 min</span>
        <span class="reminder-chip inactive">1 t</span>
      </div>
    </div>

    <!-- Dato fra/til -->
    <div class="section-header">Periode</div>
    <div class="row">
      <div class="field">
        <div class="label">Fra dato</div>
        <input class="input" type="date" value="2026-08-01">
      </div>
      <div class="field">
        <div class="label">Til dato</div>
        <input class="input" type="date" value="2026-09-01">
      </div>
    </div>

    <!-- Notat -->
    <div class="field">
      <div class="label">Notat</div>
      <input class="input" type="text" placeholder="Valgfritt notat...">
    </div>
  </div>

  <div class="modal-actions">
    <button class="modal-btn btn-cancel">Avbryt</button>
    <button class="modal-btn btn-save">Lagre</button>
  </div>
</div>

<p class="label">Medisin-form med frekvens, tider og påminnelse</p>

</body>
</html>
