<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Icons — Final Set</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f0f0; padding: 40px 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { text-align: center; margin-bottom: 8px; color: #3b5a75; font-size: 24px; }
  .subtitle { text-align: center; color: #666; margin-bottom: 32px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 16px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .icon-wrap { width: 52px; height: 52px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; background: #f8f9fa; border-radius: 14px; }
  .icon-wrap svg { width: 30px; height: 30px; }
  .label { font-size: 12px; font-weight: 600; color: #333; }
  .new-badge { background: #E8836A; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 8px; margin-top: 6px; display: inline-block; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <h1>Event Icons — Final Set</h1>
  <p class="subtitle">19 unique icons with distinct visual identities</p>

  <div class="grid">
    <!-- 1. Middag: Plate with knife and fork on sides -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E8836A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="13" r="8"/>
          <path d="M5 2v5c0 1.1.9 2 2 2h1"/>
          <path d="M5 2v9"/>
          <path d="M17 2v5c0 1.1-.9 2-2 2h-1"/>
          <path d="M17 2v9"/>
        </svg>
      </div>
      <div class="label">Middag</div>
    </div>

    <!-- 2. Bursdag: Person with party hat -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E8836A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="7" r="4"/>
          <path d="M9 11v5a2 2 0 004 0v-5"/>
          <path d="M15 5l2-3"/>
          <circle cx="17" cy="3" r="2"/>
          <path d="M17 5v2"/>
        </svg>
      </div>
      <div class="label">Bursdag</div>
    </div>

    <!-- 3. Fest: Party popper -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E8836A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5.8 11.3L2 22l10.7-3.8"/>
          <path d="M4 3h.01"/>
          <path d="M22 8h.01"/>
          <path d="M15 2h.01"/>
          <path d="M22 20h.01"/>
          <path d="M22 2l-2.24.75a2.9 2.9 0 00-1.96 3.12v.01c-.13.49-.42.96-.77 1.35-.36.4-.78.69-1.23.88A4.01 4.01 0 0022 2z"/>
        </svg>
      </div>
      <div class="label">Fest</div>
    </div>

    <!-- 4. Sport: Trophy -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#6B8F71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9H4.5a2.5 2.5 0 010-5H6"/>
          <path d="M18 9h1.5a2.5 2.5 0 000-5H18"/>
          <path d="M4 22h16"/>
          <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20 7 22"/>
          <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20 17 22"/>
          <path d="M18 2H6v7a6 6 0 0012 0V2z"/>
        </svg>
      </div>
      <div class="label">Sport</div>
    </div>

    <!-- 5. Restaurant: Plate with knife and fork on sides -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E8836A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 002-2V2"/>
          <path d="M7 2v20"/>
          <path d="M21 15V2a5 5 0 00-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>
        </svg>
      </div>
      <div class="label">Restaurant</div>
    </div>

    <!-- 6. Kino: Film strip -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E6A817" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="2"/>
          <path d="M7 2v4l3-2 3 2V2"/>
          <path d="M10 6v12"/>
          <path d="M14 6v12"/>
          <path d="M2 8h20"/>
        </svg>
      </div>
      <div class="label">Kino</div>
    </div>

    <!-- 7. Konsert: Music notes -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E8836A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <div class="label">Konsert</div>
    </div>

    <!-- 8. Trening: Person lifting dumbbell -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#6B8F71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="4" r="2"/>
          <path d="M10 7h4"/>
          <path d="M12 6v4"/>
          <path d="M10 10l-1 4"/>
          <path d="M14 10l1 4"/>
          <rect x="5" y="5.5" width="3" height="3" rx="0.5"/>
          <rect x="16" y="5.5" width="3" height="3" rx="0.5"/>
          <line x1="8" y1="7" x2="10" y2="9"/>
          <line x1="16" y1="7" x2="14" y2="9"/>
        </svg>
      </div>
      <div class="label">Trening</div>
    </div>

    <!-- Travel/Tur: Backpack -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E6A817" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20V8a4 4 0 014-4h8a4 4 0 014 4v12"/>
          <path d="M4 20h16"/>
          <path d="M8 4V2"/>
          <path d="M16 4V2"/>
          <path d="M8 20v-6h8v6"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
      </div>
      <div class="label">Tur <span class="new-badge">NY</span></div>
    </div>

    <!-- 9. Høytid: Gift box -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E8836A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 12 20 22 4 22 4 12"/>
          <rect x="2" y="7" width="20" height="5"/>
          <line x1="12" y1="22" x2="12" y2="7"/>
          <path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/>
          <path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/>
        </svg>
      </div>
      <div class="label">Høytid</div>
    </div>

    <!-- 10. Barnedag: Child with balloon -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E8836A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="7" r="4"/>
          <path d="M9 11v5a2 2 0 004 0v-5"/>
          <path d="M15 5l2-3"/>
          <circle cx="17" cy="3" r="2"/>
          <path d="M17 5v2"/>
        </svg>
      </div>
      <div class="label">Barnedag</div>
    </div>

    <!-- 11. Hjemme: House -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3b5a75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <div class="label">Hjemme</div>
    </div>

    <!-- 12. Spill: Game controller -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#9B7DB8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="12" rx="2"/>
          <circle cx="8" cy="12" r="2"/>
          <circle cx="16" cy="12" r="2"/>
          <line x1="6" y1="10" x2="6" y2="14"/>
          <line x1="18" y1="10" x2="18" y2="14"/>
        </svg>
      </div>
      <div class="label">Spill</div>
    </div>

    <!-- 13. Kaffe: Cup with steam -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E8836A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 8h1a4 4 0 010 8h-1"/>
          <path d="M3 8h14v9a4 4 0 01-4 4H7a4 4 0 01-4-4V8z"/>
          <line x1="6" y1="1" x2="6" y2="4"/>
          <line x1="10" y1="1" x2="10" y2="4"/>
          <line x1="14" y1="1" x2="14" y2="4"/>
        </svg>
      </div>
      <div class="label">Kaffe</div>
    </div>

    <!-- 14. Løping: Runner -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#6B8F71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="14" cy="4" r="2"/>
          <path d="M4 20l4-8 3 1 5-9 4 5"/>
          <path d="M11 13l-3 7"/>
          <path d="M20 14l-2 6"/>
        </svg>
      </div>
      <div class="label">Løping</div>
    </div>

    <!-- 15. Sykling: Bicycle -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#6B8F71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="5.5" cy="17.5" r="3.5"/>
          <circle cx="18.5" cy="17.5" r="3.5"/>
          <path d="M15 6h3l2 5h-4"/>
          <path d="M12 17.5l-3.5-5.5h5l3.5 5.5"/>
        </svg>
      </div>
      <div class="label">Sykling</div>
    </div>

    <!-- 16. Fjelltur: Mountain with flag -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#6B8F71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l8 16H4l8-16z"/>
          <path d="M12 3v6"/>
          <path d="M12 6l4-1"/>
        </svg>
      </div>
      <div class="label">Fjelltur</div>
    </div>

    <!-- 17. Fiske: Fish -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#7EC8E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 12c.94-3.26 2.6-6.5 5.5-8.5 4-2.7 8.5-2 11 2s2 8.5-1 11.5c-2 2-5 3-8 3-6 0-10-4-10-8 0-2 1-3 3-3 2 0 3 1 3 1"/>
          <circle cx="8" cy="12" r="1"/>
        </svg>
      </div>
      <div class="label">Fiske</div>
    </div>

    <!-- 18. Cheerleading: Two people lifting a girl up -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E8836A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="4" r="2"/>
          <path d="M12 6v3"/>
          <path d="M10 7h4"/>
          <circle cx="7" cy="14" r="2"/>
          <path d="M7 16v5"/>
          <path d="M7 16l3-4"/>
          <circle cx="17" cy="14" r="2"/>
          <path d="M17 16v5"/>
          <path d="M17 16l-3-4"/>
          <path d="M10 7l-3 7"/>
          <path d="M14 7l3 7"/>
        </svg>
      </div>
      <div class="label">Cheerleading <span class="new-badge">NY</span></div>
    </div>

    <!-- 19. Racketsport: Racket + ball -->
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#6B8F71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="16" cy="8" rx="5" ry="7" transform="rotate(-30 16 8)"/>
          <path d="M10 12l-6 10"/>
          <circle cx="8" cy="17" r="2"/>
        </svg>
      </div>
      <div class="label">Racketsport <span class="new-badge">NY</span></div>
    </div>
  </div>
</div>
</body>
</html>
