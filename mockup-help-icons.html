<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Icon Variants - Familiesenter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 40px; }
        .grid { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; }
        .variant { text-align: center; }
        .variant-label { margin-top: 10px; font-size: 13px; color: #666; font-weight: 500; }
        .variant-sublabel { font-size: 11px; color: #999; margin-top: 2px; }
        .icon-wrap { display: inline-flex; padding: 8px; background: #fff; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="grid">
        <!-- 1. Person silhouette (current) -->
        <div class="variant">
            <div class="icon-wrap">
                <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="24" cy="24" r="24" fill="#0097A7"/>
                    <circle cx="24" cy="18" r="6" fill="#fff"/>
                    <path d="M24 28C18 28 13 31 13 35V38H35V35C35 31 30 28 24 28Z" fill="#fff"/>
                </svg>
            </div>
            <div class="variant-label">Person</div>
            <div class="variant-sublabel">Bruker/person-symbol</div>
        </div>

        <!-- 2. Book/manual -->
        <div class="variant">
            <div class="icon-wrap">
                <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="24" cy="24" r="24" fill="#0097A7"/>
                    <rect x="14" y="12" width="20" height="24" rx="2" fill="none" stroke="#fff" stroke-width="2.5"/>
                    <line x1="24" y1="12" x2="24" y2="36" stroke="#fff" stroke-width="2"/>
                    <line x1="17" y1="18" x2="22" y2="18" stroke="#fff" stroke-width="1.5"/>
                    <line x1="17" y1="23" x2="22" y2="23" stroke="#fff" stroke-width="1.5"/>
                    <line x1="26" y1="18" x2="31" y2="18" stroke="#fff" stroke-width="1.5"/>
                    <line x1="26" y1="23" x2="31" y2="23" stroke="#fff" stroke-width="1.5"/>
                </svg>
            </div>
            <div class="variant-label">Bok</div>
            <div class="variant-sublabel">Håndbok/guide-symbol</div>
        </div>

        <!-- 3. Lightbulb -->
        <div class="variant">
            <div class="icon-wrap">
                <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="24" cy="24" r="24" fill="#0097A7"/>
                    <path d="M24 10C18.5 10 14 14.5 14 20C14 24 16 27 19 29V33H29V29C32 27 34 24 34 20C34 14.5 29.5 10 24 10Z" fill="#fff"/>
                    <rect x="20" y="33" width="8" height="3" rx="1" fill="#fff"/>
                    <rect x="21" y="37" width="6" height="2" rx="1" fill="#fff"/>
                </svg>
            </div>
            <div class="variant-label">Pære</div>
            <div class="variant-sublabel">Tips/ide-symbol</div>
        </div>

        <!-- 4. Info circle (i) -->
        <div class="variant">
            <div class="icon-wrap">
                <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="24" cy="24" r="24" fill="#0097A7"/>
                    <circle cx="24" cy="24" r="14" fill="none" stroke="#fff" stroke-width="2.5"/>
                    <circle cx="24" cy="18" r="2" fill="#fff"/>
                    <rect x="22.5" y="22" width="3" height="10" rx="1.5" fill="#fff"/>
                </svg>
            </div>
            <div class="variant-label">Info</div>
            <div class="variant-sublabel">Standard info-symbol</div>
        </div>

        <!-- 5. Question mark -->
        <div class="variant">
            <div class="icon-wrap">
                <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="24" cy="24" r="24" fill="#0097A7"/>
                    <text x="24" y="32" text-anchor="middle" fill="#fff" font-size="28" font-weight="700" font-family="Arial">?</text>
                </svg>
            </div>
            <div class="variant-label">Spørsmålstegn</div>
            <div class="variant-sublabel">Klassisk hjelp-symbol</div>
        </div>

        <!-- 6. Star -->
        <div class="variant">
            <div class="icon-wrap">
                <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="24" cy="24" r="24" fill="#0097A7"/>
                    <path d="M24 10L27.5 19H38L29.5 25L32.5 35L24 29L15.5 35L18.5 25L10 19H20.5L24 10Z" fill="#fff"/>
                </svg>
            </div>
            <div class="variant-label">Stjerne</div>
            <div class="variant-sublabel">Favoritt/tips-symbol</div>
        </div>

        <!-- 7. Compass -->
        <div class="variant">
            <div class="icon-wrap">
                <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="24" cy="24" r="24" fill="#0097A7"/>
                    <circle cx="24" cy="24" r="12" fill="none" stroke="#fff" stroke-width="2"/>
                    <polygon points="24,14 26,22 24,20 22,22" fill="#fff"/>
                    <polygon points="24,34 22,26 24,28 26,26" fill="#fff" opacity="0.6"/>
                </svg>
            </div>
            <div class="variant-label">Kompass</div>
            <div class="variant-sublabel">Navigasjon/veiledning</div>
        </div>

        <!-- 8. Chat bubble -->
        <div class="variant">
            <div class="icon-wrap">
                <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="24" cy="24" r="24" fill="#0097A7"/>
                    <path d="M14 16C14 14.9 14.9 14 16 14H32C33.1 14 34 14.9 34 16V26C34 27.1 33.1 28 32 28H20L14 34V28H16C14.9 28 14 27.1 14 26V16Z" fill="#fff"/>
                    <circle cx="20" cy="21" r="1.5" fill="#0097A7"/>
                    <circle cx="24" cy="21" r="1.5" fill="#0097A7"/>
                    <circle cx="28" cy="21" r="1.5" fill="#0097A7"/>
                </svg>
            </div>
            <div class="variant-label">Spretteball</div>
            <div class="variant-sublabel">Tips/assistanse</div>
        </div>

        <!-- 9. Hand with question -->
        <div class="variant">
            <div class="icon-wrap">
                <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="24" cy="24" r="24" fill="#0097A7"/>
                    <path d="M20 32V26C20 23.8 18.2 22 16 22C13.8 22 12 23.8 12 26V28" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <circle cx="24" cy="16" r="5" fill="#fff"/>
                    <text x="24" y="19.5" text-anchor="middle" fill="#0097A7" font-size="10" font-weight="700" font-family="Arial">?</text>
                </svg>
            </div>
            <div class="variant-label">Person +?</div>
            <div class="variant-sublabel">Spør om hjelp</div>
        </div>
    </div>
</body>
</html>
